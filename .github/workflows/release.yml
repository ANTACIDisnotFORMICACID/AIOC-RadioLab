name: Source release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install and test
        run: |
          python -m pip install -e '.[gui,devices,sstv,test]' build twine
          python -m pytest -q
          python -m pip check
      - name: Build packages
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install wheel and decode public fixture
        run: |
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          python -m pip install --force-reinstall --no-deps $wheel
          radiolab text decode examples\hello_afsk.wav
      - name: Verify package version matches tag
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}'
      - name: Publish prerelease with source packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/* --verify-tag --prerelease --latest=false --title "RadioLab $env:GITHUB_REF_NAME 源码预览" --notes-file RELEASE_NOTES.md
